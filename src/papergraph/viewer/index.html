<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>papergraph — evidence graph</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="pg-root">
  <canvas id="pg-canvas"></canvas>

  <div id="pg-top">
    <div class="brand">
      <span class="mark"></span>
      <h1>papergraph</h1>
      <span class="sub">evidence-graph viewer</span>
    </div>
    <span class="paper" id="pg-paper"></span>
    <div class="view-switch" role="group" aria-label="Graph view">
      <button id="pg-mode-compact" class="active" type="button" aria-pressed="true">Compact</button>
      <button id="pg-mode-full" type="button" aria-pressed="false">Full</button>
    </div>
    <a class="icon-btn" id="pg-github" href="https://github.com/ZakuZakuu/papergraph" target="_blank" rel="noopener noreferrer" title="View on GitHub" aria-label="View on GitHub">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
        <path d="M12 .5C5.73.5.75 5.48.75 11.75c0 5.02 3.26 9.28 7.78 10.78.57.1.78-.25.78-.55
          0-.27-.01-1.16-.02-2.11-3.17.69-3.84-1.35-3.84-1.35-.52-1.32-1.26-1.67-1.26-1.67-1.03-.7.08-.69.08-.69
          1.14.08 1.74 1.17 1.74 1.17 1.01 1.73 2.65 1.23 3.3.94.1-.73.4-1.23.72-1.51-2.53-.29-5.19-1.27-5.19-5.63
          0-1.24.44-2.26 1.17-3.05-.12-.29-.51-1.45.11-3.02 0 0 .96-.31 3.14 1.16a10.9 10.9 0 0 1 5.72 0
          c2.18-1.47 3.14-1.16 3.14-1.16.62 1.57.23 2.73.11 3.02.73.79 1.17 1.81 1.17 3.05 0 4.37-2.67 5.34-5.21 5.62
          .41.36.77 1.07.77 2.15 0 1.55-.01 2.8-.01 3.18 0 .3.2.66.79.55 4.52-1.51 7.78-5.76 7.78-10.78
          C23.25 5.48 18.27.5 12 .5Z"/>
      </svg>
    </a>
    <button class="icon-btn theme-btn" id="pg-theme" type="button" title="Toggle light / dark theme" aria-label="Toggle light / dark theme">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.45 1 1.18 1 1.98V16h5v-.12c0-.8.4-1.53 1-1.98A6 6 0 0 0 12 3Z"/>
      </svg>
    </button>
  </div>

  <div id="pg-rail">
    <section class="card paper-overview">
      <h2>Paper</h2>
      <div class="paper-summary" id="pg-paper-summary"></div>
      <div class="reading-basis" id="pg-reading-basis"></div>
      <div class="reading-stats" id="pg-reading-stats"></div>
    </section>
    <section class="card" id="pg-core-claims">
      <h2>Core claims</h2>
      <div class="reading-outline" id="pg-outline"></div>
    </section>
    <details class="card introduces" id="pg-introduces">
      <summary>What the paper introduces</summary>
      <div id="pg-structural"></div>
    </details>
    <section class="card questions-card">
      <h2>Open questions</h2>
      <div class="open-questions" id="pg-open-questions"></div>
    </section>
    <div class="card">
      <input class="search" id="pg-search" placeholder="search nodes…" autocomplete="off" spellcheck="false">
    </div>
    <div class="card">
      <div class="card-head">
        <h2>Categories</h2>
        <div class="head-actions">
          <button type="button" id="pg-legend-all">All</button>
          <button type="button" id="pg-legend-none">None</button>
        </div>
      </div>
      <div class="legend" id="pg-legend"></div>
    </div>
    <div class="card full-only">
      <h2>Graph</h2>
      <div class="stats" id="pg-stats"></div>
    </div>
  </div>
  <div id="pg-rail-resizer" role="separator" tabindex="0"
    aria-label="Resize sidebar" aria-orientation="vertical"
    aria-valuemin="320" aria-valuemax="600" aria-valuenow="410"></div>

  <div id="pg-claim-browser" class="detail-panel claim-panel">
    <div class="ihead">
      <button class="iclose" id="pg-claim-close" title="Close claim browser" aria-label="Close claim browser">✕</button>
      <div id="pg-claim-head"></div>
    </div>
    <div class="ibody" id="pg-claim-body"></div>
  </div>
  <div id="pg-claim-resizer" role="separator" tabindex="0"
    aria-label="Resize claim browser" aria-orientation="vertical"
    aria-valuemin="300" aria-valuemax="520" aria-valuenow="372"></div>

  <div id="pg-detail-inspector" class="detail-panel node-panel">
    <div class="ihead">
      <button class="iclose" id="pg-detail-close" title="Close inspector" aria-label="Close inspector">✕</button>
      <div id="pg-detail-head"></div>
    </div>
    <div class="ibody" id="pg-detail-body"></div>
  </div>
  <div id="pg-detail-resizer" role="separator" tabindex="0"
    aria-label="Resize node inspector" aria-orientation="vertical"
    aria-valuemin="300" aria-valuemax="520" aria-valuenow="372"></div>
  <div class="claim-detail-tabs" id="pg-mobile-tabs" aria-label="Inspector view">
    <button type="button" id="pg-tab-claim" class="active">Claim</button>
    <button type="button" id="pg-tab-detail">Node</button>
  </div>

  <div id="pg-bot">
    <div class="zoom">
      <button id="pg-rail-toggle" type="button" title="Collapse sidebar"
        aria-label="Collapse sidebar" aria-expanded="true"><span class="sidebar-glyph" aria-hidden="true"></span></button>
      <button id="pg-layout-reset" type="button" title="Restore default layout"
        aria-label="Restore default layout">&#8634;</button>
      <button id="pg-zin" title="Zoom in">+</button>
      <button id="pg-zout" title="Zoom out">−</button>
      <button id="pg-zfit" title="Fit / reset" style="width:auto;padding:0 8px;font-size:11px;font-family:var(--mono)">fit</button>
    </div>
    <div class="crumb" id="pg-crumb" style="display:none"></div>
    <div class="hint"><b>drag</b> pan · <b>scroll</b> zoom · <b>click</b> a claim/result to trace its route</div>
  </div>

  <div id="pg-tip"></div>
</div>
  <script src="app.js"></script>
</body>
</html>
