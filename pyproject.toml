[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "papergraph"
version = "0.0.2"
description = "Format-only validator + static force-directed viewer for paper evidence graphs"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "papergraph project contributors" }]
dependencies = []
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://github.com/ZakuZakuu/papergraph"
Repository = "https://github.com/ZakuZakuu/papergraph"

[project.optional-dependencies]
dev = ["pytest>=7", "build>=1"]

[project.scripts]
papergraph = "papergraph.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
papergraph = ["schemas/*.json", "viewer/*.html", "viewer/*.js", "viewer/*.css"]
