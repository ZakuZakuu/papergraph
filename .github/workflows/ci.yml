name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (editable) + dev deps
        run: python -m pip install -e ".[dev]"

      - name: Test suite (includes stdlib-only guard, wheel package-data guard)
        run: python -m pytest tests/ -v

  zipapp-smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build a .pyz from src/papergraph and run it outside the repo
        run: |
          mkdir -p /tmp/pg-pyz-build
          cp -r src/papergraph /tmp/pg-pyz-build/
          python -m zipapp /tmp/pg-pyz-build -m "papergraph.cli:main" \
            -o /tmp/papergraph.pyz -p "/usr/bin/env python3"
          mkdir -p /tmp/pg-pyz-smoke
          cp tests/fixtures/synthetic/*.json /tmp/pg-pyz-smoke/
          cd /tmp
          python /tmp/papergraph.pyz validate \
            --graph /tmp/pg-pyz-smoke/graph.json \
            --coverage /tmp/pg-pyz-smoke/coverage-plan.json \
            --source /tmp/pg-pyz-smoke/paper.json
